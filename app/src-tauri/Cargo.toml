[package]
name = "moonscale"
version = "0.1.0"
description = "Moonscale desktop control for Tailscale and Moonlight streaming"
authors = ["Tailscale Stream"]
edition = "2021"

[lib]
name = "tailscale_stream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["process", "time"] }
